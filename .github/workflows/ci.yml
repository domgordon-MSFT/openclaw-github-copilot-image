name: Preview checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux-preview:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test clean Linux install
        run: docker build --file test/Dockerfile .

  macos-preview:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Test verified runtime and stock OpenClaw
        run: |
          sudo env "PATH=$PATH" node scripts/prepare-runtime.mjs
          npm ci --ignore-scripts
          npm test
          node test/runtime-smoke.mjs
          stock="$(mktemp -d)"
          for version in 2026.11.7 2026.11.8 2026.11.9 2026.11.10; do
            npm install --prefix "$stock" --ignore-scripts --no-audit --no-fund "openclaw@$version"
            OPENCLAW_TEST_ROOT="$stock/node_modules/openclaw" npm run test:package
          done

  windows-preview:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Test verified runtime and stock OpenClaw
        shell: pwsh
        run: |
          node scripts/prepare-runtime.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          $password = ConvertTo-SecureString ("aA0!" + [Convert]::ToBase64String($bytes)) -AsPlainText -Force
          $name = 'CopilotImageSmoke'
          $null = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          try {
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $name
            $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $password)
            $node = (Get-Command node.exe).Source
            $script = Join-Path $env:GITHUB_WORKSPACE 'test\windows-smoke.ps1'
            $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $log = Join-Path $env:RUNNER_TEMP 'copilot-runtime-smoke.log'
            $errors = Join-Path $env:RUNNER_TEMP 'copilot-runtime-smoke.err'
            $process = Start-Process -FilePath $powershell -ArgumentList "-NoProfile -NonInteractive -File `"$script`" `"$node`"" -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $errors
            if ($process.ExitCode) { Get-Content -LiteralPath $errors; exit $process.ExitCode }
          } finally {
            Remove-LocalUser -Name $name
          }
          $stock = Join-Path $env:RUNNER_TEMP 'stock-host'
          foreach ($version in '2026.11.7','2026.11.8','2026.11.9','2026.11.10') {
            npm install --prefix "$stock" --ignore-scripts --no-audit --no-fund "openclaw@$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:OPENCLAW_TEST_ROOT = Join-Path $stock 'node_modules\openclaw'
            npm run test:package
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
