name: Preview checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test clean Linux x64 install
        run: docker build --platform linux/amd64 --file test/Dockerfile .
